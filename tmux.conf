# ----------------------------------------
# Core Settings
# ----------------------------------------
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

# ----------------------------------------
# Keybindings
# ----------------------------------------
# Free Neovim's Ctrl+b and set prefix to Ctrl+\
unbind C-b
# Set prefix to Ctrl + a
set-option -g prefix C-a
bind C-a send-prefix

# Quick Tab Navigation
bind -n S-Left  previous-window
bind -n S-Right next-window
bind h previous-window
bind l next-window
bind Tab last-window

# Enable mouse control (clickable windows, panes, resizable borders, and scrolling)
set -g mouse on

# Enforce vi keybindings in copy mode explicitly
setw -g mode-keys vi

# ----------------------------------------
# Minimal Tokyo Night Theme
# ----------------------------------------
set -g status on
set -g status-position bottom

# Default status bar colours (Tokyo Night Background, Foreground)
set -g status-style bg="#1a1b26",fg="#c0caf5"

# Left side: Clean session name (Cyan)
set -g status-left "#[fg=#7dcfff,bold] [#S] "
set -g status-left-length 40

# Window list styles (Dark grey inactive, Blue active)
set -g window-status-format " #[fg=#565f89]#I: #[fg=#c0caf5]#W "
set -g window-status-current-format " #[fg=#7aa2f7,bold]#I: #W "

# Pane borders
set -g pane-border-style fg="#414868"
set -g pane-active-border-style fg="#7aa2f7"

# ----------------------------------------
# Dynamic Prefix Hints
# ----------------------------------------
# Shows Yellow copy mode hints if in copy mode, Purple prefix hints if prefix is pressed, or nothing.
set -g status-right-length 150
set -g status-right '#{?pane_in_mode,#[bg=#e0af68]#[fg=#1a1b26]#[bold] [?]search [n]next [N]prev [C-u/d]page [Enter]copy [q]quit ,#{?client_prefix,#[bg=#bb9af7]#[fg=#1a1b26]#[bold] [c]new [#,]name [w]list [x]kill [z]oom [%]vsplit ["]hsplit [s]ess [d]etach [[]scroll ,}}'
